<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Случайные шутки</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <h1>Случайные шутки</h1>

        <div class="joke-card">
            <p class="joke-question">
                Нажимай вперед
            </p>

            <p class="joke-answer">
                Чтобы получить приколы
            </p>
        </div>

        <div class="navigation">
            <button class="btn btn-back">
                ← Назад
            </button>

            <button class="btn btn-next">
                Вперед →
            </button>
        </div>

        <p class="counter">Шутка 1 из 1</p>
    </main>

    <script src="script.js"></script>
</body>

</html>
